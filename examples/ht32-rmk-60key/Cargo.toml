[package]
name = "rmk-ht32-60key"
version = "0.1.0"
authors = ["hitsmaxft <mfthits@gmail.com>"]
description = "60-key mechanical keyboard firmware for HT32F523xx using RMK"
homepage = "https://github.com/haobogu/rmk"
repository = "https://github.com/haobogu/rmk"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
default = []
# Test-only SWD mailbox used to inject RMK matrix events without a wired PCB.
swd-key-inject = [
    "embassy-ht32f523xx/defmt",
    "embassy-time/defmt-timestamp-uptime",
    "dep:defmt",
    "dep:defmt-rtt",
    "dep:panic-probe",
]

[dependencies]
# Keep the 16 KiB target lean: fixed keymap, no Vial and no persistent storage.
# Pin both crates to the same reviewed revision for reproducible builds.
rmk = { git = "https://github.com/haobogu/rmk", rev = "1c1f5888c38b9ef41c23b7810c1f49b48f06e2d3", default-features = false, features = ["async_matrix"] }
rmk-types = { git = "https://github.com/haobogu/rmk", rev = "1c1f5888c38b9ef41c23b7810c1f49b48f06e2d3", default-features = false }
cortex-m = { workspace = true, features = ['critical-section-single-core'] }
cortex-m-rt = { workspace = true }
# Minimal Embassy features; logging is omitted to preserve RAM and Flash.
embassy-executor = { workspace = true, features = ["arch-cortex-m", "executor-thread"] }
embassy-time = { workspace = true }
embassy-ht32f523xx = { workspace = true, features = ["rt", "usb", "ht32f52352"] }
ht32f523x2 = { workspace = true }
static_cell = "2"
portable-atomic = { version = "1.0", features = ["critical-section"] }
embedded-hal = { workspace = true }
critical-section = { workspace = true }
defmt = { workspace = true, optional = true }
defmt-rtt = { workspace = true, optional = true }
panic-probe = { workspace = true, optional = true, features = ["print-defmt"] }
# Use panic-halt instead of panic-probe to save memory.
panic-halt = "1.0"


[[bin]]
name = "rmk-ht32-60key"
path = "src/main.rs"
test = false
bench = false
