[package]
name = "usb-raw-hid-speed-test"
version = "0.1.0"
edition = "2024"
authors = ["Embassy-ht32 Contributors"]
license = "MIT OR Apache-2.0"

[dependencies]
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
embassy-executor = { workspace = true, features = ["arch-cortex-m", "executor-interrupt", "defmt"] }
embassy-futures = { workspace = true }
embassy-sync = { workspace = true }
embassy-time = { workspace = true, features = ["defmt"] }
embassy-usb = { workspace = true }
defmt = { workspace = true }
defmt-rtt = { workspace = true }
panic-probe = { workspace = true, features = ["print-defmt"] }
portable-atomic = { version = "1.0", features = ["critical-section"] }
static_cell = "2"

embassy-ht32f523xx = { workspace = true, features = ["rt", "usb", "defmt", "ht32f52352"] }
